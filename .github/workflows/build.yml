name: Build And Upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release; empty takes the ref the run was started from'
        required: false
        type: string
        default: ''
  push:
    tags:
      - "*"

jobs:
  call-reusable-workflow:
    uses: intisy/workflows/.github/workflows/build.yml@main
    with:
      ref_name: ${{ inputs.tag || github.ref_name }}
      java_version: '8'
      jdk_distribution: temurin
      publish_task: publishGithub
      test_task: ciTest --no-daemon --info
      test_java_version: '11'
      test_runners: '["ubuntu-latest", "macos-latest", "windows-latest"]'
    secrets:
      envPAT: ${{ secrets.PAT }}
